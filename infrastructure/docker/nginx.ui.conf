# Control plane UI — serve SPA and reverse-proxy API on one origin.
# SPA routes (/audit, /security, /consent) must NOT be swallowed by API prefixes.

upstream razorguard_api {
    server api:8000;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location = /health/live {
        proxy_pass http://razorguard_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $http_x_request_id;
    }

    location ^~ /agent/        { proxy_pass http://razorguard_api; include /etc/nginx/proxy_params; }
    location ^~ /intents       { proxy_pass http://razorguard_api; include /etc/nginx/proxy_params; }
    location ^~ /policy/       { proxy_pass http://razorguard_api; include /etc/nginx/proxy_params; }
    location ^~ /consents/     { proxy_pass http://razorguard_api; include /etc/nginx/proxy_params; }
    location ^~ /merchants/    { proxy_pass http://razorguard_api; include /etc/nginx/proxy_params; }
    location ^~ /audit/events  { proxy_pass http://razorguard_api; include /etc/nginx/proxy_params; }
    location ^~ /security/dashboard { proxy_pass http://razorguard_api; include /etc/nginx/proxy_params; }
    location ^~ /chaos/         { proxy_pass http://razorguard_api; include /etc/nginx/proxy_params; }
    location ^~ /payments/     { proxy_pass http://razorguard_api; include /etc/nginx/proxy_params; }
    location ^~ /protocols/    { proxy_pass http://razorguard_api; include /etc/nginx/proxy_params; }
    location ^~ /webhooks/     { proxy_pass http://razorguard_api; include /etc/nginx/proxy_params; }
    location ^~ /metrics       { proxy_pass http://razorguard_api; include /etc/nginx/proxy_params; }
    location ^~ /docs          { proxy_pass http://razorguard_api; include /etc/nginx/proxy_params; }
    location ^~ /redoc         { proxy_pass http://razorguard_api; include /etc/nginx/proxy_params; }
    location ^~ /openapi.json  { proxy_pass http://razorguard_api; include /etc/nginx/proxy_params; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
