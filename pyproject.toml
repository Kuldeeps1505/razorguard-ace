[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "razorguard-ace"
version = "0.1.0"
description = "Zero-trust agentic commerce & payment control plane"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "python-multipart==0.0.12",

    # Database
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "asyncpg==0.30.0",
    "psycopg2-binary==2.9.10",

    # Cache / locks
    "redis==5.2.1",
    "hiredis==3.1.0",

    # Validation
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",

    # Security
    "cryptography==44.0.0",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",

    # HTTP client
    "httpx==0.28.1",

    # Task queue
    "celery==5.4.0",
    "kombu==5.4.2",

    # Observability
    "structlog==24.4.0",
    "prometheus-client==0.21.1",
    "opentelemetry-api==1.29.0",
    "opentelemetry-sdk==1.29.0",
    "opentelemetry-instrumentation-fastapi==0.50b0",

    # Razorpay
    "razorpay==1.4.2",

    # LLM
    "anthropic==0.40.0",
    "openai==1.57.2",
    "google-genai==1.0.0",

    # Utilities
    "python-dotenv==1.0.1",
    "tenacity==9.0.0",
    "arrow==1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "pytest-mock==3.14.0",
    "httpx==0.28.1",
    "ruff==0.8.4",
    "mypy==1.13.0",
    "pre-commit==4.0.1",
    "factory-boy==3.3.1",
    "faker==33.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/razorguard"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "S", "B", "A", "COM", "C4", "DTZ", "T20", "RET", "SIM"]
ignore = ["S101", "COM812", "A003", "ARG001", "ARG003", "S104"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ARG", "N806", "F841", "E702"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--cov=src/razorguard --cov-report=term-missing --cov-fail-under=70"

[tool.coverage.run]
source = ["src/razorguard"]
omit = ["*/migrations/*", "*/tests/*"]
